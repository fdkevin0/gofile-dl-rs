name: Lint and Build

on:
  pull_request:
    branches:
      - "main"
      - "release-please-**"
  push:
    branches:
      - "main"
      - "develop"
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !startsWith(github.event.pull_request.title || github.event.head_commit.message || '', 'docs') }}
    uses: ./.github/workflows/lint.yaml
    secrets: inherit # pass all secrets to the called workflow

  test:
    if: ${{ !startsWith(github.event.pull_request.title || github.event.head_commit.message || '', 'docs') }}
    uses: ./.github/workflows/test.yaml
    needs: [lint]
    secrets: inherit # pass all secrets to the called workflow

  build:
    if: >-
      ${{
        !startsWith(github.event.pull_request.title || github.event.head_commit.message || '', 'docs')
        && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message || '', 'chore(main): release') || startsWith(github.event.head_commit.message || '', 'chore: release')))
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_docker-build-and-push.yaml
    needs: [test]
    secrets: inherit # pass all secrets to the called workflow
    with:
      # Publish rolling :main image on push to main (semver & :latest are handled in release.yaml)
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

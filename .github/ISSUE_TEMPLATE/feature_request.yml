name: Feature request
description: Propose a new capability or improvement for gofile-dl
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow gap or pain point you are encountering
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution and alternatives
      description: Describe the behavior you want and any alternatives you considered
    validations:
      required: true

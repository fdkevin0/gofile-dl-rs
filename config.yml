# GoFile Downloader Configuration

# Web server settings
port: 2355
host: "0.0.0.0"
# secret_key: "" # Leave unset to auto-generate a random secret key (or set SECRET_KEY env var)

# Download settings
base_dir: "./output" # Base directory for downloads (overridden by BASE_DIR=/data in Docker)
default_retries: 3 # Default retry attempts for failed downloads
retry_delay: 5 # Seconds to wait between retries
default_throttle: null # Default throttle in KB/s (null for unlimited)

# Task retention
task_expiry: 604800 # Seconds after which terminal tasks are auto-removed (7 days; 0 = never)

# Logging
log_level: "INFO"

# MegaLinter configuration for Safe Rust Docker applications
APPLY_FIXES: all

ENABLE:
  - RUST
  - DOCKERFILE
  - YAML
  - MARKDOWN
  - JSON

# HEALTHCHECK's CMD uses shell-form for ${PORT} substitution and `|| exit 1`;
# appuser is pinned to numeric UID 1000 via `useradd -u 1000`.
DOCKERFILE_HADOLINT_ARGUMENTS: "--ignore DL3008 --ignore DL3018 --ignore DL3003 --ignore DL3025 --ignore DL3066"

FILTER_REGEX_EXCLUDE: '(\.git|\.docker|target|pgo-data|output|downloads|\.agents|migration_infographic\.html)'

PARALLEL: true
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
GITHUB_COMMENT_REPORTER: false

DISABLE_LINTERS:
  - COPYPASTE
  - SPELL

DISABLE_ERRORS_LINTERS:
  - MARKDOWN

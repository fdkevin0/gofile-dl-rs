[package]
name = "gofile-dl"
version = "1.8.3"
edition = "2021"
rust-version = "1.85"
description = "High-performance, 100% Safe Rust GoFile.io CLI & Web Downloader"
repository = "https://github.com/fdkevin0/gofile-dl-rs"
license = "MIT"
readme = "README.md"

[lib]
name = "gofile_dl"
path = "src/lib.rs"

[[bin]]
name = "gofile-dl"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
hmac = "0.12"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1.6"
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
